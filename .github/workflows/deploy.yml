name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Type check
        working-directory: ./backend
        run: npm run typecheck
        continue-on-error: true

      - name: Deploy to Cloudflare
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler publish

      - name: Verify deployment
        run: |
          sleep 5
          curl -s https://voice-ai-demo.workers.dev/api/auth/verify-session \
            -H "Authorization: Bearer invalid" | grep -q "error" && echo "✅ Deployment verified" || echo "⚠️ Verification failed"

      - name: Notify success
        if: success()
        run: echo "✅ Deployment to Cloudflare Workers completed successfully"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed"
